# CI (N02, N03): calidad del núcleo, contrato de la API, arranque del contenedor y puerta de mutación.
# Integra el CI original del repo con la plantilla común del portafolio.
# Un job «skipped» NO es verde: ningún job depende de otro ni se condiciona al tipo de evento,
# así que en un PR corren todos y cada uno puede ser check requerido.
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pruebas:
    name: pruebas (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false          # que una versión falle no debe cancelar ni esconder la otra
      matrix:
        python: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: requirements-*.txt
      - name: instalar
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt -r requirements-live.txt
          pip install -e .
      - name: lint (ruff)
        run: ruff check treasuryforge tests scripts api
      - name: tipos (mypy)
        run: mypy
      - name: seguridad del código (bandit)
        run: bandit -r treasuryforge api -q -ll
      - name: dependencias declaradas (pip-audit)
        run: pip-audit -r requirements-live.txt -r requirements-dev.txt -r api/requirements.txt --progress-spinner off
      # La cobertura se reporta y tiene un piso (fail_under = 90 en pyproject), pero la compuerta real
      # es una prueba por regla: docs/reglas.md.
      - name: pruebas + cobertura
        run: pytest --junitxml=reporte.xml --cov=treasuryforge --cov-report=xml --cov-report=term
      - name: probar que corrieron pruebas
        run: python3 herramientas/verificar_reportes.py pytest reporte.xml
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: pruebas-${{ matrix.python }}
          path: |
            reporte.xml
            coverage.xml

  api:
    name: API (contrato + arranque del contenedor)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'      # la misma versión que la imagen de Render (api/Dockerfile)
          cache: pip
          cache-dependency-path: api/requirements*.txt
      - run: pip install -r api/requirements-dev.txt
      - name: pruebas de contrato
        run: pytest api/tests --junitxml=reporte-api.xml
      - run: python3 herramientas/verificar_reportes.py pytest reporte-api.xml
      # Prueba de arranque: la imagen que despliega Render debe levantar y responder, no sólo construir.
      - name: construir la imagen de la API
        run: docker build -f api/Dockerfile -t treasuryforge-api:ci .
      - name: arrancar y probar con humo
        run: |
          docker run -d --name api -p 8000:8000 -e PORT=8000 treasuryforge-api:ci
          bash herramientas/humo.sh api http://127.0.0.1:8000
      - name: bitácora del contenedor
        if: always()
        run: docker logs api || true

  mutacion:
    # Puerta de mutación original (>= 85 % por componente). En serie toma ~32 min (medido en local el
    # 2026-11-19: los 42 componentes pasan, el más bajo 85 %); se reparte
    # en 6 fragmentos round-robin (scripts/mutation.sh --shard K/6) para que corra en cada PR.
    name: mutación (fragmento ${{ matrix.fragmento }}/6)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        fragmento: [1, 2, 3, 4, 5, 6]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-*.txt
      - name: instalar
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt -r requirements-live.txt
          pip install -e .
      - name: puerta de mutación (>= 85 % por componente)
        run: bash scripts/mutation.sh --shard ${{ matrix.fragmento }}/6
